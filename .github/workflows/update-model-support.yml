name: Model Support Refresh (Providers and Default Models)

on:
  schedule:
    # Kétnaponta hajnalban, UTC szerint. A default modell gyakrabban változik,
    # mint a profilszöveg, de ritkábban, mint a csillagszám.
    - cron: '0 4 */2 * *'
  workflow_dispatch:
    # Kézi indításhoz

jobs:
  update-model-support:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Detect Providers and Default Models
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run update-model-support

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add src/content/clones/

          git diff --staged --quiet || (git commit -m "chore: refresh detected providers and default models" && git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push)
